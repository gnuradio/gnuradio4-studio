name: WASM build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  control-plane-wasm:
    name: Control-plane WASM (Ubuntu 24.04 | Emscripten | Release)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gnuradio/gnuradio4-blocks-sdk:main-ubuntu-24.04-emscripten-release

    steps:
      - name: Check out gnuradio4-studio
        uses: actions/checkout@v4
        with:
          path: gnuradio4-studio

      - name: Check out gnuradio4-control-plane
        uses: actions/checkout@v4
        with:
          repository: gnuradio/gnuradio4-control-plane
          ref: main
          path: gnuradio4-control-plane
          fetch-depth: 0

      - name: Build and install Studio blocks (Emscripten)
        shell: bash
        env:
          PKG_CONFIG_PATH: /opt/gnuradio4/lib/pkgconfig:/opt/gnuradio4/lib64/pkgconfig:/opt/gnuradio4/share/pkgconfig
        run: |
          if ! command -v pkg-config >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends pkg-config
          fi
          system_node="$(command -v node)"
          emcmake cmake -S gnuradio4-studio/blocks -B build-studio-blocks \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DCMAKE_PREFIX_PATH=/opt/gnuradio4 \
            -DCMAKE_FIND_ROOT_PATH=/opt/gnuradio4 \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}" \
            -DCMAKE_INSTALL_PREFIX=/opt/gnuradio4 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-studio-blocks --parallel 4
          cmake --install build-studio-blocks

      - name: Configure control-plane (Emscripten)
        shell: bash
        run: |
          system_node="$(command -v node)"
          emcmake cmake -S gnuradio4-control-plane -B build-control-plane \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            -DCMAKE_PREFIX_PATH=/opt/gnuradio4 \
            -DCMAKE_FIND_ROOT_PATH=/opt/gnuradio4 \
            -DGR4CP_GNURADIO4_PREFIX=/opt/gnuradio4 \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build control-plane
        run: cmake --build build-control-plane --parallel 4

      - name: Verify WASM module
        run: |
          test -s build-control-plane/gr4cp_wasm.mjs
          test -s build-control-plane/gr4cp_wasm.wasm

      - name: Upload WASM module
        uses: actions/upload-artifact@v4
        with:
          name: gr4cp-wasm
          path: |
            build-control-plane/gr4cp_wasm.mjs
            build-control-plane/gr4cp_wasm.wasm
          if-no-files-found: error

  studio-web:
    name: Studio web app (WASM control plane)
    needs: control-plane-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download WASM module
        uses: actions/download-artifact@v4
        with:
          name: gr4cp-wasm
          path: public/wasm

      - name: Install dependencies
        run: npm ci

      - name: Run npm tests
        run: npm test

      - name: Build web app
        env:
          VITE_CONTROL_PLANE_TRANSPORT: wasm
        run: npm run build:web

      - name: Verify bundled WASM module
        run: |
          test -s dist/wasm/gr4cp_wasm.mjs
          test -s dist/wasm/gr4cp_wasm.wasm

      - name: Add dev server script
        run: install -m 755 scripts/serve.py dist/serve.py

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: gr4-studio-web
          path: dist
          if-no-files-found: error

      - name: Check public bucket setup
        id: checksetup
        # sigh: github, you know this will come back to bite you, why don't you have a "check presence"
        # function usable in "if:" ???
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#example-using-secrets
        run: >
          [[ -n "${{ vars.PUB_BUCKET_NAME }}"
          && -n "${{ vars.PUB_BUCKET_KEY_ID }}" ]]
          && echo "hasthings=true" >> "${GITHUB_OUTPUT}"
          || echo 'could not find bucket setup'
      - name: Upload to public bucket (all but .js)
        if: ${{ steps.checksetup.outputs.hasthings == 'true' }}
        uses: backblaze-labs/b2-action@v1.2.0
        with:
          action: upload
          application-key-id: ${{ vars.PUB_BUCKET_KEY_ID }}
          application-key: ${{ secrets.PUB_BUCKET_KEY }}
          bucket: ${{ vars.PUB_BUCKET_NAME }}
          source: dist
          destination: commit/${{ github.sha }}
          exclude: '**/*.js, serve.py'
      - name: Gather .js files in staging directory
        # the b2 action is extremely stupid: you can't change into a directory,
        # and if you're using globs, you can't remove a leading directory
        # components. the include: and exclude: filters just don't work the way
        # the documentation says, as they're actually post-filters. Not that
        # there's much documentation to speak of.
        # so, globs in source: is a non-feature, and we need to stage the .js 
        # files in a separate directory. Sigh.
        if: ${{ steps.checksetup.outputs.hasthings == 'true' }}
        id: gatherfiles
        shell: bash
        run: |
          jsdir="${RUNNER_TEMP}/jsfiles"
          mkdir -p "${jsdir}"
          shopt -s dotglob globstar
          (cd dist && cp -v --parents -- **/*.js "${jsdir}")
          printf 'jsdir=%s\n' "${jsdir}" >> "${GITHUB_OUTPUT}"
      - name: Upload to public bucket (.js files)
        if: ${{ steps.checksetup.outputs.hasthings == 'true' }}
        uses: backblaze-labs/b2-action@v1.2.0
        with:
          action: upload
          application-key-id: ${{ vars.PUB_BUCKET_KEY_ID }}
          application-key: ${{ secrets.PUB_BUCKET_KEY }}
          bucket: ${{ vars.PUB_BUCKET_NAME }}
          # Got to explicitly mark JavaScript as such, otherwise MIME type
          # gets auto-assigned, and that'd be application/json, which makes
          # browsers rejects an attempt to load it as script
          content-type: application/javascript
          source: ${{ steps.gatherfiles.outputs.jsdir }}
          destination: commit/${{ github.sha }}
      - name: Print URL
        if: ${{ steps.checksetup.outputs.hasthings == 'true' }}
        run: >
          printf '::notice title="Artifact URL"::https://%s.backblazeb2.com/file/%s/commit/%s/index.html\n'
          f004
          ${{ vars.PUB_BUCKET_NAME }}
          ${{ github.sha }}

